services:
  # ==========================================
  # DATABASE - POSTGRESQL
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: quick-transfer-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: quick_transfer
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - quick-transfer-net

  # ==========================================
  # SPRING BOOT APPLICATION
  # ==========================================
  app:
    build: .
    container_name: quick-transfer-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/quick_transfer
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USER}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      PUBLIC_KEY: ${PUBLIC_KEY}
      PRIVATE_KEY: ${PRIVATE_KEY}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@quick-transfer.local}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - quick-transfer-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3


  # ==========================================
  # NETWORK BRIDGE
  # ==========================================
  rede-externa-bridge:
    image: alpine/socat
    container_name: quick-transfer-bridge
    restart: unless-stopped
    command: TCP4-LISTEN:8082,fork,reuseaddr TCP4:app:8080
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      - app
    networks:
      - quick-transfer-net

# ==========================================
# GLOBAL RESOURCES
# ==========================================
volumes:
  postgres_data:
    driver: local

networks:
  quick-transfer-net:
    driver: bridge
