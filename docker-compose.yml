version: '3.8'

services:
  # ==========================================
  # DATABASE - POSTGRESQL
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: quick-transfer-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: quick_transfer
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend -d quick_transfer"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - quick-transfer-net

  # ==========================================
  # SPRING BOOT APPLICATION
  # ==========================================
  app:
    build: .
    container_name: quick-transfer-app
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: ${DATABASE_URL}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USER}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - quick-transfer-net


  # ==========================================
  # NETWORK BRIDGE
  # ==========================================
  rede-externa-bridge:
    image: alpine/socat
    container_name: quick-transfer-bridge
    restart: unless-stopped
    command: TCP4-LISTEN:8082,fork,reuseaddr TCP4:app:8080
    ports:
      - "0.0.0.0:8082:8082"
    depends_on:
      - app
    networks:
      - quick-transfer-net

# ==========================================
# GLOBAL RESOURCES
# ==========================================
volumes:
  postgres_data:
    driver: local

networks:
  quick-transfer-net:
    driver: bridge
