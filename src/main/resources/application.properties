spring.config.import=optional:file:.env[.properties]

# =========================
# APPLICATION NAME
# =========================
spring.application.name=quick-transfer
server.port=8080
server.servlet.context-path=/api

# =========================
# DATABASE - POSTGRESQL
# =========================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =========================
# SQL INIT
# =========================
spring.sql.init.mode=never

# =========================
# JSON
# =========================
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.serialization.indent-output=true
spring.data.web.pageable.default-page-size=50
spring.data.web.pageable.max-page-size=100

# =========================
# JWT
# =========================
app.jwt.expiration=86400000
app.jwt.issuer=${JWT_ISSUER:quick-transfer}

# =========================
# JWT (Asymmetric RSA Keys)
# =========================
app.security.jwt.public-key=${PUBLIC_KEY}
app.security.jwt.private-key=${PRIVATE_KEY}

# =========================
# SECURITY
# =========================
spring.security.filter.dispatcher-types=async,request,error
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
app.security.cookie.secure=${COOKIE_SECURE:true}

# =========================
# CORS
# =========================
app.cors.allowed-origins=${ALLOWED_ORIGINS}
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,Accept,X-XSRF-TOKEN
app.cors.allow-credentials=true

# =========================
# LOGS
# =========================
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF

# =========================
# ACTUATOR
# =========================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# =========================
# MAIL SENDER
# =========================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLED:true}

# =========================
# APPLICATION LINKS / MAIL
# =========================
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.mail.from=${MAIL_FROM:no-reply@quick-transfer.local}
app.cache.local.enabled=${LOCAL_CACHE_ENABLED:false}
