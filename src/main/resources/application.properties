spring.config.import=optional:file:.env[.properties]

spring.application.name=quick-transfer
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api
server.shutdown=graceful
server.forward-headers-strategy=framework
server.compression.enabled=true
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DATABASE_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true

spring.jackson.time-zone=${APP_TIME_ZONE:America/Sao_Paulo}
spring.jackson.serialization.indent-output=false

app.jwt.expiration=${JWT_EXPIRATION_MS:3600000}
app.jwt.issuer=${JWT_ISSUER:quick-transfer}
app.security.jwt.public-key=${PUBLIC_KEY}
app.security.jwt.private-key=${PRIVATE_KEY}
app.security.cookie-secure=${COOKIE_SECURE:true}

app.cors.allowed-origins=${ALLOWED_ORIGINS}
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,Accept,X-XSRF-TOKEN
app.cors.exposed-headers=X-Correlation-ID
app.cors.allow-credentials=true

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
spring.security.filter.dispatcher-types=async,request,error

logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:false}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME}}
app.frontend-url=${FRONTEND_URL}

app.reminders.cron=${REMINDER_CRON:0 */5 * * * *}
app.reminders.zone=${REMINDER_ZONE:America/Sao_Paulo}
app.reminders.look-ahead-hours=${REMINDER_LOOK_AHEAD_HOURS:24}
app.reminders.batch-size=${REMINDER_BATCH_SIZE:100}

app.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.name=${BOOTSTRAP_ADMIN_NAME:}
app.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
